name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd /opt/apps/primeimpact

            git pull origin main

            cd server

            docker build -t primeimpact-api:latest .

            docker stop primeimpact-api 2>/dev/null || true
            docker rm primeimpact-api 2>/dev/null || true

            docker run -d \
              --name primeimpact-api \
              --restart unless-stopped \
              --env-file /opt/apps/primeimpact/env/production.env \
              -p 127.0.0.1:3001:3001 \
              primeimpact-api:latest

            docker image prune -f
